<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Editar producto</title>
</head>

<body>
    <h1 class="text-4xl font-bold text-base-content">Editar producto</h1>
    <form action="/actualizar/{{producto.0}}" method="post">
        <label>Nombre:</label>
        <input type="text" name="nombre" value="{{producto.1}}" required>
        <br>
        <label>Descripción:</label>
        <input type="text" name="descripcion" value="{{producto.2}}" required>
        <br>
        <label>Precio:</label>
        <input type="number" name="precio" value="{{producto.3}}" required>
        <br>
        <label>Stock:</label>
        <input type="number" name="stock" value="{{producto.4}}" required>
        <br>
        <input type="submit" value="Actualizar producto" class="btn btn-primary">

    </form>
</body>

</html>
